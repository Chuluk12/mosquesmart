services:
  api:
    container_name: mosquesmart-api
    image: ${IMAGE_REGISTRY:-ghcr.io/chuluk12/mosquesmart}/api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      API_PORT: 3000
      AUDIO_STORAGE_DIR: /app/storage/audio
    command: npm run start -w apps/api
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - default
      - postgres_database
    volumes:
      - audio_storage:/app/storage/audio
    restart: unless-stopped

  admin-web:
    container_name: mosquesmart-admin-web
    image: ${IMAGE_REGISTRY:-ghcr.io/chuluk12/mosquesmart}/admin-web:${IMAGE_TAG:-latest}
    depends_on:
      - api
    ports:
      - "${ADMIN_WEB_PORT:-5173}:80"
    restart: unless-stopped

  display-web:
    container_name: mosquesmart-display-web
    image: ${IMAGE_REGISTRY:-ghcr.io/chuluk12/mosquesmart}/display-web:${IMAGE_TAG:-latest}
    depends_on:
      - api
    ports:
      - "${DISPLAY_WEB_PORT:-5174}:80"
    restart: unless-stopped

volumes:
  audio_storage:

networks:
  postgres_database:
    external: true
    name: ${POSTGRES_NETWORK:-postgres_database}
