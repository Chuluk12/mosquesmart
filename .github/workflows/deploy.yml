name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/chuluk12/mosquesmart

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build files
        shell: bash
        run: |
          set -eu
          test -f Dockerfile
          test -f nginx-spa.conf
          test -f package-lock.json

      - name: Set image metadata
        id: meta
        shell: bash
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/api:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Admin Web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          build-args: |
            WEB_APP=admin-web
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/admin-web:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/admin-web:latest
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web

      - name: Build and push Display Web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          build-args: |
            WEB_APP=display-web
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/display-web:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/display-web:latest
          cache-from: type=gha,scope=display-web
          cache-to: type=gha,mode=max,scope=display-web

  deploy:
    name: Deploy on VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Write OpenVPN config
        shell: bash
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
        run: |
          test -n "$OPENVPN_CONFIG"
          printf '%s' "$OPENVPN_CONFIG" > "$RUNNER_TEMP/mosquesmart.ovpn"

      - name: Install OpenVPN
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn openvpn-systemd-resolved

      - name: Connect to OpenVPN
        uses: kota65535/github-openvpn-connect-action@v2
        with:
          config_file: ${{ runner.temp }}/mosquesmart.ovpn
          username: ${{ secrets.OPENVPN_USERNAME }}
          password: ${{ secrets.OPENVPN_PASSWORD }}

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 40m
          envs: IMAGE_NAMESPACE,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd "$HOME/repositories/mosquesmart"
            test -f .env
            trap 'status=$?; echo "Deployment failed with exit code $status"; docker compose --env-file .env ps -a; docker compose --env-file .env logs --tail=100 api admin-web display-web || true; exit "$status"' ERR
            git fetch origin main
            git reset --hard origin/main
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            export IMAGE_REGISTRY="$IMAGE_NAMESPACE"
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose --env-file .env pull
            if ! docker compose --env-file .env run --rm --no-build api npm run prisma:deploy -w apps/api; then
              echo "WARNING: Prisma migration failed. Continuing deployment; run migration manually after checking the logs."
            fi
            docker compose --env-file .env up -d --no-build --remove-orphans --timeout 60
            docker compose --env-file .env ps -a
            docker image prune -f
            docker logout ghcr.io
